<title>Templo de Umbanda Sagrada — Giras, Anotações e Dicas</title>
<style>
:root{--bg:#ffffff;--card:rgba(255,255,255,.94);--tx:#1f1a14;--mu:#7a6f60;--ac:#a86a00;--ac2:#fff3d4;--g1:#f7bf2a;--g2:#ec8a12;--au:#e8a50c;--on:#2a1700;--hg:linear-gradient(90deg,#1c2575,#b97a08);--bd:rgba(150,110,40,.18);--ok:#2f7a4a;--sh:0 8px 30px rgba(150,100,20,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:99999px){:root:not([data-theme="light"]){--bg:#070a1f;--card:rgba(18,24,64,.7);--tx:#f4f1e6;--mu:#a9b0d6;--ac:#f5c43a;--ac2:#1b2255;--g1:#3a4fe0;--g2:#1a2290;--au:#ffd04a;--on:#1a1200;--hg:linear-gradient(90deg,#ffd04a,#f29a1a);--bd:rgba(255,215,120,.16);--ok:#6fcf93;--sh:0 8px 30px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070a1f;--card:rgba(18,24,64,.7);--tx:#f4f1e6;--mu:#a9b0d6;--ac:#f5c43a;--ac2:#1b2255;--g1:#3a4fe0;--g2:#1a2290;--au:#ffd04a;--on:#1a1200;--hg:linear-gradient(90deg,#ffd04a,#f29a1a);--bd:rgba(255,215,120,.16);--ok:#6fcf93;--sh:0 8px 30px rgba(0,0,0,.5);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(80px);opacity:.35;animation:float 14s ease-in-out infinite alternate}
body::before{width:380px;height:380px;background:#f2b41a;top:-120px;right:-100px}
body::after{width:340px;height:340px;background:#f3b9b9;bottom:-120px;left:-100px;animation-delay:-6s}
@keyframes float{to{transform:translate(30px,40px) scale(1.15)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
.w{max-width:780px;margin:0 auto;padding:18px 16px 70px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;animation:drop .6s both}
.top h1{margin:0;font:800 clamp(22px,5vw,30px)/1.15 system-ui;background:var(--hg);-webkit-background-clip:text;background-clip:text;color:transparent}
.top .sub{margin:0;color:var(--mu);font-size:14px}
.me{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--bd);background:var(--card);backdrop-filter:blur(10px);padding:5px 12px 5px 5px;border-radius:99px;cursor:pointer;color:var(--tx);font:600 14px inherit;transition:transform .2s}
.me:hover{transform:scale(1.04)}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
nav{display:flex;gap:6px;margin:18px 0;padding:5px;background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);animation:up .6s .1s both;overflow-x:auto}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 12px;border-radius:12px;font:600 14px inherit;cursor:pointer;white-space:nowrap;transition:color .2s,background .2s}
nav button:hover{color:var(--tx)}
nav button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);animation:pop .35s both}
#panel{animation:up .45s both}
.card,.cal,.adm{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--bd);border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh);animation:up .5s both;animation-delay:calc(var(--i,0)*70ms)}
.card{transition:transform .2s}.card:hover{transform:translateY(-2px)}
.card h3{margin:0 0 2px;font-size:17px}.card p{margin:6px 0 0;white-space:pre-wrap}
.mu{color:var(--mu);font-size:14px}
.g{display:flex;gap:14px;align-items:flex-start}
.dt{min-width:56px;text-align:center;background:linear-gradient(160deg,var(--g1),var(--g2));border-radius:14px;padding:7px 4px;color:var(--on)}
.dt b{display:block;font-size:22px;line-height:1.1}.dt span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.9}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700;text-transform:capitalize}
.ch button{border:0;background:var(--ac2);color:var(--tx);width:36px;height:36px;border-radius:10px;font-size:18px;cursor:pointer;transition:transform .15s}.ch button:active{transform:scale(.88)}
.gr{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.gr .h{font-size:12px;color:var(--mu);padding:4px 0}
.d{aspect-ratio:1;border-radius:11px;display:grid;place-items:center;font-size:14px;animation:pop .4s both;animation-delay:calc(var(--i,0)*12ms)}
.d.ev{background:linear-gradient(135deg,#ffd84a,#f08a0a);color:#2a1700;font-weight:700}
.d.td{outline:2px solid var(--ac);outline-offset:1px}.d.ed{cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 14px;border-radius:99px;font:600 13px inherit;cursor:pointer;transition:all .2s}
.chips button.on{background:var(--g1);color:var(--on);border-color:var(--g1)}
.tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ac);background:var(--ac2);padding:2px 9px;border-radius:99px;margin-bottom:4px}
.empty{color:var(--mu);text-align:center;padding:26px 0}
.adm{border:2px dashed var(--ac)}
label{display:block;font-size:13px;color:var(--mu);margin:9px 0 3px}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}
.row{display:flex;gap:8px}.row>div{flex:1}
.btn{border:0;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);padding:12px 20px;border-radius:12px;font:700 15px inherit;cursor:pointer;margin-top:12px;transition:transform .15s,box-shadow .2s;box-shadow:0 6px 16px rgba(232,130,12,.35)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}
.btn.o{background:none;color:var(--mu);box-shadow:none;border:1px solid var(--bd)}
.x{border:0;background:none;color:var(--mu);cursor:pointer;font-size:13px;margin-left:auto;padding:4px 8px}.x:hover{color:var(--ac)}
.hd{display:flex;align-items:flex-start;gap:8px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ok);color:#fff;padding:10px 14px;border-radius:14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;animation:drop .4s both}
.bar button{border:0;background:#fff;color:#1d5a35;padding:8px 14px;border-radius:10px;font-weight:700;cursor:pointer}
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(20,10,5,.55);backdrop-filter:blur(8px);animation:pop .4s both;overflow:auto}
.ob{width:100%;max-width:400px;background:var(--bg);border:1px solid var(--bd);border-radius:24px;padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:up .55s .1s both;text-align:center}
.ob h2{margin:6px 0 2px;font-size:24px}.ob label{text-align:left}
.pic{width:92px;height:92px;margin:6px auto 0;border-radius:50%;background:var(--ac2);display:grid;place-items:center;font-size:30px;overflow:hidden;cursor:pointer;border:2px dashed var(--ac);transition:transform .2s}.pic:hover{transform:scale(1.06)}
.pic img{width:100%;height:100%;object-fit:cover}
.load{text-align:center;padding:80px 0;color:var(--mu);animation:pop 1s infinite alternate}
.logo{width:60px;height:60px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--au),0 6px 22px rgba(242,180,26,.45);animation:spin .9s both,glow 4s 1s ease-in-out infinite alternate}
@keyframes spin{from{opacity:0;transform:rotate(-140deg) scale(.5)}to{opacity:1;transform:none}}
@keyframes glow{to{box-shadow:0 0 0 2px var(--au),0 6px 36px rgba(242,180,26,.85)}}
.logo.big{width:124px;height:124px;display:block;margin:0 auto 8px}
.top>div:first-of-type{flex:1 1 170px;min-width:0}
.foot{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:34px;color:var(--mu);font-size:13px;text-align:center;animation:up .6s .3s both}.foot img{width:36px;height:36px;border-radius:50%}
.load img{width:110px;height:110px;border-radius:50%;box-shadow:0 0 40px rgba(242,180,26,.6)}
.ov .ob{margin:auto}
.bg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.b{border:1px solid var(--bd);border-radius:14px;padding:10px 6px;text-align:center;background:var(--card)}
.b.on{border-color:var(--au);box-shadow:0 0 18px rgba(242,180,26,.35);animation:pop .5s both}
.b.off{opacity:.4;filter:grayscale(1)}
.b i{font-style:normal;font-size:28px;display:block}.b b{font-size:13px;display:block;line-height:1.2}.b small{display:block;color:var(--mu);font-size:11px}
.cel{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;background:rgba(5,8,30,.72);backdrop-filter:blur(6px);animation:pop .3s both;overflow:hidden}
.cb{position:relative;z-index:2;background:var(--bg);border:2px solid var(--au);border-radius:26px;padding:26px 22px;max-width:340px;text-align:center;box-shadow:0 0 60px rgba(242,180,26,.6);animation:boom .7s cubic-bezier(.2,1.5,.4,1) both}
.cb .big{font-size:72px;display:block;animation:wob 1.2s infinite alternate}
@keyframes boom{from{opacity:0;transform:scale(.3) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes wob{to{transform:scale(1.15) rotate(6deg)}}
.pt{position:fixed;left:50%;top:50%;font-size:30px;z-index:1;pointer-events:none;animation:fly 1.9s cubic-bezier(.1,.7,.3,1) both;animation-delay:var(--dl)}
@keyframes fly{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}70%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r)) scale(1.4)}}
#intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 40%,#fffdf6 0,#fff6df 60%,#ffeab8 100%);color:#1f1a14;overflow:hidden;cursor:pointer;transition:opacity .7s,transform .7s}
#intro.out{opacity:0;transform:scale(1.08);pointer-events:none}
#intro::before{display:none;content:"";position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#fff,transparent),radial-gradient(2px 2px at 85% 65%,#ffd04a,transparent),radial-gradient(1.5px 1.5px at 35% 80%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 55%,#c9cffc,transparent);background-size:320px 320px;animation:tw 3s ease-in-out infinite}
#intro .rays{position:absolute;width:150vmax;height:150vmax;background:repeating-conic-gradient(rgba(255,208,74,.2) 0 6deg,transparent 6deg 18deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 55%);mask-image:radial-gradient(circle,#000 0,transparent 55%);animation:rot 28s linear infinite,pop 1.5s both}
#intro .lg{position:relative;width:min(56vw,240px);height:min(56vw,240px);animation:lgin 1.4s cubic-bezier(.2,1.2,.3,1) both}
#intro .lg img{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 3px #ffd04a,0 0 60px rgba(255,208,74,.7);animation:pl 2.4s 1.4s ease-in-out infinite}
#intro .lg::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #ffd04a;animation:ring 2s 1s ease-out infinite}
#intro h1{position:relative;margin:30px 0 4px;font:800 clamp(24px,6vw,36px)/1.15 system-ui;color:#8a5600;animation:up .9s 1.1s both}
#intro p{position:relative;margin:0;color:#7a6f60;animation:up .9s 1.4s both}
#intro small{position:relative;margin-top:34px;color:#a09483;animation:up .8s 2.2s both}
@keyframes lgin{from{opacity:0;transform:rotate(-200deg) scale(.2)}to{opacity:1;transform:none}}
@keyframes ring{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(1.8)}}
@keyframes pl{50%{box-shadow:0 0 0 3px #ffd04a,0 0 95px rgba(255,208,74,1)}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes tw{50%{opacity:.35}}
#panel.leave{animation:leave .22s ease-in both}
@keyframes leave{to{opacity:0;transform:translateY(-12px) scale(.97)}}
.tg{margin-left:6px;background:linear-gradient(110deg,#ffd84a 30%,#fff3b0 50%,#f08a0a 70%);background-size:220% 100%;color:#2a1700;animation:shine 3.5s linear infinite}
@keyframes shine{to{background-position:-220% 0}}
.mail{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:13px 14px;margin-bottom:9px;cursor:pointer;box-shadow:var(--sh);animation:up .5s both;animation-delay:calc(var(--i,0)*60ms);transition:transform .2s,border-color .2s}
.mail:hover{transform:translateX(5px);border-color:var(--au)}
.mail .ic{font-size:26px;flex:none}.mail .mb{flex:1;min-width:0}
.mail .mt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mail.un .mt{font-weight:800}
.mail .ms{color:var(--mu);font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mail .md{font-size:12px;color:var(--mu);flex:none;align-self:flex-start}
.dot{width:10px;height:10px;border-radius:50%;background:var(--g2);flex:none;box-shadow:0 0 0 3px var(--ac2)}
.mc{width:100%;max-width:520px;margin:auto;display:flex;flex-direction:column;align-items:center}
.env{position:relative;width:140px;height:92px;perspective:700px;animation:envOut .5s 1.3s forwards}
.env .bk{position:absolute;inset:0;border-radius:10px;background:linear-gradient(160deg,var(--g1),var(--g2));box-shadow:0 10px 30px rgba(0,0,0,.3)}
.env .lt{position:absolute;left:14px;right:14px;top:12px;bottom:8px;background:#fff;border-radius:6px;animation:peek .6s .7s forwards}
.env .fl{position:absolute;left:0;right:0;top:0;height:54px;transform-origin:top;background:linear-gradient(180deg,#ffd84a,#e8820c);clip-path:polygon(0 0,100% 0,50% 100%);animation:flap .6s .3s ease-in-out forwards}
.lw{width:100%;background:var(--bg);border:2px solid var(--au);border-radius:22px;padding:20px 20px 22px;box-shadow:0 0 50px rgba(242,180,26,.45);animation:letter .75s .85s cubic-bezier(.2,1.2,.3,1) both}
@keyframes flap{to{transform:rotateX(180deg)}}
@keyframes peek{to{transform:translateY(-34px)}}
@keyframes envOut{to{opacity:0;height:0}}
@keyframes letter{from{opacity:0;transform:translateY(80px) scale(.6) rotate(-3deg)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  if(canEdit)h+='<div class="adm"><b>Modo edição</b><div class="row"><div><label>Nome do terreiro</label><input value="'+esc(D.nome)+'" onchange="D.nome=this.value;mark()"></div><div><label>Subtítulo</label><input value="'+esc(D.sub)+'" onchange="D.sub=this.value;mark()"></div></div><label>Senha dos filhos da casa '+(D.fh?'(definida ✓)':'(ainda não definida)')+'</label><input type="text" placeholder="Digite a nova senha e saia do campo" onchange="setFh(this.value)"></div>';

const isM=()=>member||canEdit,vis=x=>x.vis!=='filhos'||isM(),TAGF='<span class="tag tg">⭐ Filhos da casa</span>';
async function hh(p){return [...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p)))].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function access(){const v=val('pw2');if(!v)return;const a=await hh('terreiro:'+v),f=await hh('fh:'+v);if(a===PH){if(!can&&typeof claude!=='undefined')return alert('O modo admin precisa da sua conta de editor do site.');canEdit=true;editing=false;return render()}if(D.fh&&f===D.fh){member=true;await sv('role',{h:D.fh});editing=false;return render()}alert('Senha incorreta.')}
function acesso(){const t='<h3 style="margin:22px 0 0">Acesso especial</h3>';if(canEdit)return t+'<p class="mu" style="margin:4px 0 0">🔓 Modo admin ativo.</p><button class="btn o" onclick="editing=false;lock()">Sair do admin</button>';if(member)return t+'<p class="mu" style="margin:4px 0 0">⭐ Acesso de filho da casa ativo.</p><button class="btn o" onclick="editing=false;leaveM()">Sair do acesso</button>';return t+'<p class="mu" style="margin:4px 0 8px">Admin ou filho da casa? Digite a sua senha.</p><input id="pw2" type="password" autocomplete="off" placeholder="Senha" onkeydown="if(event.key===\'Enter\')access()"><button class="btn" onclick="access()">Entrar</button>'}
let readIds=new Set();

function welcome(){let p='';const em=['✨','🕯️','🌟','🤍'];for(let i=0;i<30;i++){const a=Math.random()*6.283,d=120+Math.random()*(innerWidth>600?420:200);p+='<span class="pt" style="--x:'+Math.cos(a)*d+'px;--y:'+(Math.sin(a)*d+60)+'px;--r:'+Math.round(Math.random()*360-180)+'deg;--dl:'+(Math.random()*.4).toFixed(2)+'s">'+em[i%4]+'</span>'}const e=document.createElement('div');e.className='cel';e.innerHTML=p+'<div class="cb" style="max-height:90vh;overflow:auto"><img class="logo big" src="'+LOGO+'" alt=""><h2 style="margin:8px 0 6px">Saravá, '+esc(prof.nome.split(' ')[0])+'!</h2><p style="margin:0 0 10px">Seja muito bem-vindo(a) à nossa casa! Que a luz de Olorum ilumine os seus caminhos e que Pai Oxalá cubra a sua vida de paz.</p><p style="margin:0 0 10px">Que os seus guias e protetores abram as suas portas, afastem tudo o que não lhe faz bem e tragam saúde, prosperidade, amor e alegria para você e para a sua família.</p><p class="mu" style="margin:0">Que a gente se encontre nas giras de coração aberto. Axé e muita luz! 🕯️</p><button class="btn" onclick="this.closest(\'.cel\').remove()">Entrar na casa</button></div>';e.onclick=ev=>{if(ev.target===e)e.remove()};document.body.appendChild(e)}

function badges(){let h='<h3 style="margin:22px 0 0">Minhas conquistas</h3>';for(const k in LN){const L=LN[k],c=cnt(k);h+='<p class="mu" style="margin:12px 0 0;text-align:left">'+L.e+' '+L.n+' — '+c+(c===1?' gira':' giras')+'</p><div class="bg">'+L.t.map(t=>'<div class="b '+(c>=t[0]?'on':'off')+'"><i>'+t[2]+'</i><b>'+t[1]+'</b><small>'+t[0]+(t[0]>1?' giras':' gira')+'</small></div>').join('')+'</div>'}return h+'<p class="mu" style="font-size:12px">Registre suas giras na aba Anotações escolhendo a linha de trabalho.</p>'}
function pickFoto(inp){const f=inp.files[0];if(!f)return;const i=new Image();i.onload=()=>{const s=160,c=document.createElement('canvas');c.width=c.height=s;const m=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,s,s);foto=c.toDataURL('image/jpeg',.8);const p=document.querySelector('.pic');if(p)p.innerHTML='<img src="'+foto+'" alt="">'};i.src=URL.createObjectURL(f)}
async function saveProf(){const n=val('pn').trim(),a=val('pa');if(!n)return alert('Digite seu nome.');if(!a||+a<1)return alert('Digite sua idade.');const first=!prof;prof={nome:n,idade:+a,foto};editing=false;await sv('profile',prof);render();if(first)welcome()}

function giras(){
  const y=cur.getFullYear(),m=cur.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),t=today(),ev=new Set(D.giras.map(g=>g.data));
  let c='<div class="cal"><div class="ch"><button onclick="nav(-1)" aria-label="Mês anterior">‹</button><span>'+MF[m]+' '+y+'</span><button onclick="nav(1)" aria-label="Próximo mês">›</button></div><div class="gr">'+['D','S','T','Q','Q','S','S'].map(x=>'<div class="h">'+x+'</div>').join('');
  for(let i=0;i<first;i++)c+='<div></div>';
  for(let d=1;d<=n;d++){const k=key(y,m,d);c+='<div class="d'+(ev.has(k)?' ev':'')+(k===t?' td':'')+(canEdit?' ed':'')+'"'+st(d)+(canEdit?' onclick="pick(\''+k+'\')"':'')+'>'+d+'</div>'}
  c+='</div></div>';
  if(canEdit)c+='<div class="adm"><b>Nova gira</b> <span class="mu">(toque num dia para preencher a data)</span><div class="row"><div><label>Data</label><input type="date" id="gd" value="'+esc(pre)+'"></div><div><label>Horário</label><input type="time" id="gh" value="19:30"></div></div><label>Tema / linha de trabalho</label><input id="gt"><label>Observações</label><textarea id="go" rows="2"></textarea><button class="btn" onclick="addG()">Adicionar gira</button></div>';
  const l=[...D.giras].sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora)),up=l.filter(g=>g.data>=t),past=l.filter(g=>g.data<t).reverse();
  c+='<h3>Próximas giras</h3>'+(up.length?up.map(card).join(''):'<div class="empty">Nenhuma gira agendada.</div>');
  if(past.length)c+='<h3 class="mu">Anteriores</h3>'+past.slice(0,5).map(card).join('');
  return c;
}
function card(g,i){const p=P(g.data);return '<div class="card g"'+st(i)+'><div class="dt"><b>'+p.d+'</b><span>'+M[p.m]+'</span></div><div style="flex:1"><h3>'+esc(g.tema||'Gira')+'</h3><div class="mu">'+esc(g.hora)+'</div>'+(g.obs?'<p>'+esc(g.obs)+'</p>':'')+'</div>'+(canEdit?'<button class="x" onclick="del(\'giras\',\''+g.id+'\')">Excluir</button>':'')+'</div>'}

  const opts=[...D.giras].sort((a,b)=>b.data.localeCompare(a.data)).map(g=>'<option value="'+esc(fmt(g.data)+' — '+(g.tema||'Gira'))+'">').join('');

(async()=>{
  try{
    const u=await claude.use('user');

    if(!art)can=false;

  }catch(e){canEdit=false}
  prof=await ld('profile');
  notes=(await ld('notes'))||{items:[]};
  {const r=await ld('role');member=!!(r&&r.h&&r.h===D.fh);const rr=await ld('read');readIds=new Set(rr&&rr.ids||[])}
